<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Interactive Deck — one JSON spec builds one self-contained interactive deck site: flow canvas with minimap, camera viewport and nav dock">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b1b20" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1b1b20" opacity=".08"/>
    </pattern>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset=".55" stop-color="#17b978"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
  </defs>

  <!-- paper stage -->
  <rect width="1200" height="420" rx="24" fill="#f5f3ed"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#1b1b20" stroke-opacity=".14" stroke-width="2"/>

  <!-- ruler ticks -->
  <g stroke="#1b1b20" stroke-opacity=".22" stroke-width="1">
    <path d="M120 0V8M240 0V8M360 0V8M480 0V8M600 0V14M720 0V8M840 0V8M960 0V8M1080 0V8"/>
    <path d="M60 0V5M180 0V5M300 0V5M420 0V5M540 0V5M660 0V5M780 0V5M900 0V5M1020 0V5M1140 0V5"/>
  </g>

  <!-- construction diagonal -->
  <line x1="70" y1="392" x2="620" y2="52" stroke="#1b1b20" stroke-opacity=".1" stroke-width="1.5" stroke-dasharray="6 7"/>

  <!-- wordmark -->
  <text x="64" y="166" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="#1b1b20">Interactive</text>
  <text x="64" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="#5b6cff">Deck</text>

  <!-- gradient divider -->
  <rect x="66" y="286" width="470" height="3" rx="1.5" fill="url(#divider)"/>

  <!-- tagline (mono, single language) -->
  <text x="64" y="322" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#4a4a55">one JSON spec &#8594; one self-contained interactive site</text>

  <!-- BY nameplate: double-line frame -->
  <g fill="none" stroke="#1b1b20">
    <rect x="64" y="344" width="152" height="36" rx="6" stroke-width="1.5"/>
    <rect x="68" y="348" width="144" height="28" rx="4" stroke-width="1"/>
  </g>
  <text x="140" y="367" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="4" fill="#1b1b20">BY jqu224</text>

  <!-- minimap card (product signature, top-right) -->
  <rect x="958" y="52" width="176" height="118" rx="10" fill="#1b1b20" opacity=".08"/>
  <rect x="952" y="44" width="176" height="118" rx="10" fill="#fffdf8" stroke="#1b1b20" stroke-width="2"/>
  <text x="966" y="66" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#6b6b76">MAP &#183; 1/6</text>
  <g stroke="#c9c6bd" stroke-width="1.2" fill="none" stroke-dasharray="3 3">
    <path d="M984 88V110M1020 88V110M1056 88h22M1038 99h30"/>
  </g>
  <rect x="966" y="76" width="36" height="24" rx="4" fill="#5b6cff"/>
  <rect x="1002" y="76" width="36" height="24" rx="4" fill="#e6e4dd"/>
  <rect x="966" y="110" width="36" height="24" rx="4" fill="#e6e4dd"/>
  <rect x="1068" y="88" width="24" height="20" rx="4" fill="#e6e4dd"/>
  <rect x="1068" y="118" width="24" height="16" rx="4" fill="#e6e4dd"/>
  <rect x="962" y="72" width="44" height="32" rx="6" fill="none" stroke="#5b6cff" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- edge: start node -> vote node -->
  <path d="M798 208 C824 208 830 238 850 240" fill="none" stroke="#1b1b20" stroke-width="1.8" stroke-dasharray="5 5"/>
  <path d="M842 232 L852 240 L840 247" fill="none" stroke="#1b1b20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- edge: vote node -> decision diamond -->
  <path d="M1030 202 C1052 202 1056 224 1062 230" fill="none" stroke="#1b1b20" stroke-width="1.8" stroke-dasharray="5 5"/>
  <path d="M1054 224 L1064 231 L1053 239" fill="none" stroke="#1b1b20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start node -->
  <rect x="644" y="162" width="160" height="104" rx="12" fill="#1b1b20" opacity=".07"/>
  <rect x="638" y="154" width="160" height="104" rx="12" fill="#fffdf8" stroke="#1b1b20" stroke-width="2.5"/>
  <rect x="652" y="166" width="44" height="7" rx="3.5" fill="#17b978" transform="rotate(-1 674 169)"/>
  <circle cx="718" cy="212" r="25" fill="#fff" stroke="#1b1b20" stroke-width="2"/>
  <path d="M710 200 L733 212 L710 224 Z" fill="#5b6cff" stroke="#5b6cff" stroke-width="2" stroke-linejoin="round"/>
  <text x="652" y="248" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#6b6b76">START</text>
  <!-- annotation pin -->
  <circle cx="792" cy="160" r="10" fill="#ff6b4a"/>
  <text x="792" y="164" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#fff">1</text>

  <!-- vote node inside camera viewport -->
  <rect x="856" y="198" width="200" height="140" rx="14" fill="#1b1b20" opacity=".07"/>
  <rect x="850" y="190" width="200" height="140" rx="14" fill="#fffdf8" stroke="#1b1b20" stroke-width="2.5"/>
  <rect x="848" y="182" width="216" height="156" rx="16" fill="rgba(91,108,255,.05)" stroke="#5b6cff" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="864" y="204" width="40" height="7" rx="3.5" fill="#e39b16" transform="rotate(-1 884 207)"/>
  <polygon points="898,246 890,262 912,246" fill="#fff" stroke="#1b1b20" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="874" y="222" width="86" height="28" rx="8" fill="#fff" stroke="#1b1b20" stroke-width="1.8"/>
  <text x="917" y="241" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1b1b20">VOTE?</text>
  <rect x="982" y="284" width="12" height="30" fill="#e6e4dd"/>
  <rect x="1000" y="266" width="12" height="48" fill="#e39b16"/>
  <rect x="1018" y="248" width="12" height="66" fill="#5b6cff"/>
  <text x="1024" y="240" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#5b6cff">78%</text>
  <line x1="974" y1="314" x2="1038" y2="314" stroke="#1b1b20" stroke-width="2" stroke-linecap="round"/>

  <!-- decision diamond -->
  <path d="M1108 196 L1148 236 L1108 276 L1068 236 Z" fill="#fff" stroke="#1b1b20" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1108" y="246" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e39b16">?</text>

  <!-- nav dock -->
  <rect x="706" y="360" width="224" height="46" rx="23" fill="#1b1b20" opacity=".07"/>
  <rect x="700" y="354" width="224" height="46" rx="23" fill="#fff" stroke="#1b1b20" stroke-width="2"/>
  <circle cx="728" cy="377" r="14" fill="#fff" stroke="#1b1b20" stroke-width="2"/>
  <path d="M732 371 L724 377 L732 383" fill="none" stroke="#1b1b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="754" y="373" width="18" height="8" rx="4" fill="#5b6cff"/>
  <circle cx="784" cy="377" r="3.5" fill="#c9c6bd"/>
  <circle cx="800" cy="377" r="3.5" fill="#c9c6bd"/>
  <circle cx="816" cy="377" r="3.5" fill="#c9c6bd"/>
  <circle cx="832" cy="377" r="3.5" fill="#c9c6bd"/>
  <circle cx="848" cy="377" r="3.5" fill="#c9c6bd"/>
  <circle cx="896" cy="377" r="16" fill="#1b1b20"/>
  <path d="M892 371 L900 377 L892 383" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- confetti bits -->
  <g transform="translate(1170,120) rotate(18)"><rect x="-3.5" y="-6" width="7" height="12" rx="2" fill="#17b978"/></g>
  <g transform="translate(1178,168) rotate(-22)"><rect x="-3.5" y="-6" width="7" height="12" rx="2" fill="#e39b16"/></g>
</svg>
